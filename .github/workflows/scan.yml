name: Sports Scan

on:
  schedule:
    # Every 2 hours, 8am–midnight ET (12:00–04:00 UTC next day)
    - cron: "0 12,14,16,18,20,22,0,2,4 * * *"
  workflow_dispatch:

# Shared lock across ALL fanduel-bot workflows — only one runs at a time.
# This eliminates git conflicts between concurrent scan/injury/morning runs.
concurrency:
  group: fanduel-git
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  # ── Job 1: Run the scan. No git operations here. ─────────────────────────
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          ODDS_API_KEY:             ${{ secrets.ODDS_API_KEY }}
          DISCORD_SPORTS_WEBHOOK:   ${{ secrets.DISCORD_SPORTS_WEBHOOK }}
          DISCORD_HEALTH_WEBHOOK:   ${{ secrets.DISCORD_HEALTH_WEBHOOK }}
        run: python run_scan.py

      - name: Regenerate dashboard
        run: python generate_data.py

      - name: Upload outputs for commit job
        uses: actions/upload-artifact@v4
        with:
          name: scan-data-${{ github.run_id }}
          path: |
            bets_log.csv
            bot.log
            data/
            docs/data.json
          if-no-files-found: ignore
          retention-days: 1

  # ── Job 2: Fresh checkout → apply outputs → single atomic commit. ─────────
  commit:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Self-heal git state
        run: |
          rm -f .git/index.lock .git/MERGE_HEAD .git/rebase-merge/head-name 2>/dev/null || true
          git rebase --abort 2>/dev/null || true
          git checkout -- . 2>/dev/null || true

      - name: Download scan outputs
        uses: actions/download-artifact@v4
        with:
          name: scan-data-${{ github.run_id }}
          path: .

      - name: Commit and push
        run: |
          git config user.name  "fanduel-bot[actions]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bets_log.csv bot.log data/ docs/data.json 2>/dev/null || true
          git diff --staged --quiet && echo "Nothing to commit." && exit 0
          git commit -m "📊 scan $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase -X ours origin/main && git push && break
            echo "Push attempt $attempt failed — retrying in 15s..."
            git rebase --abort 2>/dev/null || true
            git checkout -- . 2>/dev/null || true
            sleep 15
          done
