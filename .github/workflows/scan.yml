name: Sports Scan

on:
  schedule:
    # Every 2 hours, 8am–midnight ET (12:00–04:00 UTC next day)
    - cron: "0 12,14,16,18,20,22,0,2,4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          ODDS_API_KEY:             ${{ secrets.ODDS_API_KEY }}
          DISCORD_SPORTS_WEBHOOK:   ${{ secrets.DISCORD_SPORTS_WEBHOOK }}
          DISCORD_HEALTH_WEBHOOK:   ${{ secrets.DISCORD_HEALTH_WEBHOOK }}
        run: python run_scan.py

      - name: Regenerate dashboard
        run: python generate_data.py

      - name: Commit
        run: |
          git config user.name  "fanduel-bot[actions]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bets_log.csv bot.log data/ docs/data.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "📊 scan $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
