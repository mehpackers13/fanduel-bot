name: Sports Scan

# DECOMMISSIONED 2026-10-15 — strategy migrated to kalshi-bot which can
# auto-execute via Kalshi's API (vs this bot being alert-only against
# FanDuel/DK/MGM which have no retail trading API).
# Keeping workflow_dispatch so you can manually re-run for historical
# comparison; cron scanning is off.
on:
  workflow_dispatch:

# Shared lock across ALL fanduel-bot workflows — only one runs at a time.
# This eliminates git conflicts between concurrent scan/injury/morning runs.
concurrency:
  group: fanduel-git
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        continue-on-error: true
        env:
          ODDS_API_KEY:             ${{ secrets.ODDS_API_KEY }}
          DISCORD_SPORTS_WEBHOOK:   ${{ secrets.DISCORD_SPORTS_WEBHOOK }}
          DISCORD_HEALTH_WEBHOOK:   ${{ secrets.DISCORD_HEALTH_WEBHOOK }}
        run: python run_scan.py

      - name: Regenerate dashboard
        if: always()
        run: python generate_data.py

      - name: Commit and push
        if: always()
        run: |
          git config user.name  "fanduel-bot[actions]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git status --short
          git diff --quiet HEAD && echo "Nothing to commit." && exit 0
          git commit -a -m "📊 scan $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase -X ours origin/main && git push && echo "Push succeeded on attempt $attempt." && break
            echo "Push attempt $attempt failed — retrying in 15s..."
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
