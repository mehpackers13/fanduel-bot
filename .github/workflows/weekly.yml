name: Weekly Report

on:
  schedule:
    - cron: "0 0 * * 1"   # Monday 00:00 UTC = Sunday 8pm EDT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly report
        env:
          DISCORD_SPORTS_WEBHOOK: ${{ secrets.DISCORD_SPORTS_WEBHOOK }}
        run: python run_weekly.py

      - name: Regenerate dashboard
        run: python generate_data.py

      - name: Commit
        run: |
          git config user.name  "fanduel-bot[actions]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data.json bot.log 2>/dev/null || true
          git diff --staged --quiet || git commit -m "📊 weekly-report $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
