name: Weekly Report

on:
  schedule:
    - cron: "0 0 * * 1"   # Monday 00:00 UTC = Sunday 8pm EDT
  workflow_dispatch:

# Shared lock across ALL fanduel-bot workflows — only one runs at a time.
concurrency:
  group: fanduel-git
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  # ── Job 1: Run weekly report. No git operations here. ─────────────────────
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly report
        env:
          DISCORD_SPORTS_WEBHOOK: ${{ secrets.DISCORD_SPORTS_WEBHOOK }}
        run: python run_weekly.py

      - name: Regenerate dashboard
        run: python generate_data.py

      - name: Upload outputs for commit job
        uses: actions/upload-artifact@v4
        with:
          name: weekly-data-${{ github.run_id }}
          path: |
            bot.log
            data/
            docs/data.json
          if-no-files-found: ignore
          retention-days: 1

  # ── Job 2: Fresh checkout → apply outputs → single atomic commit. ─────────
  commit:
    needs: weekly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Self-heal git state
        run: |
          rm -f .git/index.lock .git/MERGE_HEAD .git/rebase-merge/head-name 2>/dev/null || true
          git rebase --abort 2>/dev/null || true
          git checkout -- . 2>/dev/null || true

      - name: Download weekly outputs
        uses: actions/download-artifact@v4
        with:
          name: weekly-data-${{ github.run_id }}
          path: .

      - name: Commit and push
        run: |
          git config user.name  "fanduel-bot[actions]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.log data/ docs/data.json 2>/dev/null || true
          git diff --staged --quiet && echo "Nothing to commit." && exit 0
          git commit -m "📊 weekly-report $(date -u '+%Y-%m-%d')"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase -X ours origin/main && git push && break
            echo "Push attempt $attempt failed — retrying in 15s..."
            git rebase --abort 2>/dev/null || true
            git checkout -- . 2>/dev/null || true
            sleep 15
          done
